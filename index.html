<form id="admin-book-form" onsubmit="adminAddBookOffline(event)" class="space-y-3 bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
    <h4 class="font-extrabold text-xs uppercase text-emerald-900 tracking-wider">Unggah E-Book PDF (Dari Perangkat Offline)</h4>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" id="admin-book-title" required class="text-sm border border-slate-200 rounded-xl px-4 py-2.5 bg-slate-50" placeholder="Judul Buku">
        <input type="text" id="admin-book-author" required class="text-sm border border-slate-200 rounded-xl px-4 py-2.5 bg-slate-50" placeholder="Penulis">
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <select id="admin-book-category" class="text-sm border border-slate-200 rounded-xl px-4 py-2.5 bg-slate-50">
            <option value="Agama & Akhlak">Agama & Akhlak</option>
            <option value="Sains & Riset">Sains & Riset</option>
            <option value="Bahasa & Sastra">Bahasa & Sastra</option>
        </select>
        <div class="flex flex-col">
            <label class="text-[11px] font-bold text-slate-600 mb-1">Pilih File PDF dari Komputer/HP:</label>
            <input type="file" id="admin-book-file" accept="application/pdf" required class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer">
        </div>
    </div>
    <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition">Unggah & Publikasikan Buku</button>
</form>
