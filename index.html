<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog E-Book Madrasah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .emerald-gradient { background: linear-gradient(135deg, #065f46 0%, #047857 50%, #022c22 100%); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 p-6 md:p-10">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Bagian Katalog Utama -->
        <div class="glass-card p-8 rounded-3xl shadow-sm border space-y-6">
            
            <!-- Tampilan 1: Menu 15 Kategori Utama -->
            <div id="catalog-main-menu" class="space-y-6">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 border-b pb-6">
                    <div>
                        <h2 class="text-xl font-black text-slate-900"><i class="fa-solid fa-book-bookmark text-emerald-700 mr-2"></i> Katalog E-Book Berdasarkan Kategori</h2>
                        <p class="text-xs text-slate-500 mt-1">Pilih salah satu dari 15 kategori di bawah untuk menjelajahi koleksi bukunya.</p>
                    </div>
                    <input type="text" id="search-book" onkeyup="globalSearchBooks()" placeholder="Cari judul buku atau penulis..." class="text-sm border border-slate-200 rounded-xl px-4 py-2.5 w-full md:w-72 focus:outline-emerald-600 bg-white shadow-xs">
                </div>

                <!-- Grid 15 Kategori -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4" id="genre-cards-grid">
                    <!-- Diisi otomatis oleh JavaScript -->
                </div>
            </div>

            <!-- Tampilan 2: Daftar Buku dalam Kategori (Hidden Awal) -->
            <div id="catalog-sub-view" class="space-y-6 hidden">
                <div class="flex justify-between items-center border-b pb-4">
                    <button onclick="backToGenreMenu()" class="inline-flex items-center gap-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 text-xs font-bold px-4 py-2 rounded-xl transition cursor-pointer">
                        <i class="fa-solid fa-arrow-left"></i> Kembali ke 15 Kategori Utama
                    </button>
                    <h3 id="current-genre-title" class="font-extrabold text-slate-900 text-base">Nama Kategori</h3>
                </div>
                
                <div id="subgenre-book-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <!-- Buku-buku dalam kategori tersebut -->
                </div>
            </div>

        </div>
    </div>

    <!-- Modal E-Reader Sederhana -->
    <div id="reader-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-4xl h-[85vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl border">
            <div class="p-4 bg-[#022c22] text-white flex justify-between items-center">
                <h3 id="reader-book-title" class="font-bold text-sm">Sedang Membaca E-Book</h3>
                <button onclick="closeReader()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-xs transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="flex-1 bg-slate-100 p-2">
                <iframe id="reader-frame" src="" class="w-full h-full rounded-2xl border border-slate-200 bg-white"></iframe>
            </div>
        </div>
    </div>

    <!-- Script Logika Katalog -->
    <script>
        const masterBooks = [
            // 1. Fiksi
            { title: "Bulan Terbelah di Langit Madinah", author: "Habiburrahman El Shirazi", category: "1. Fiksi", sub: "Novel" },
            { title: "Kumpulan Cerpen Santri Pilihan", author: "Tim Literasi Santri", category: "1. Fiksi", sub: "Cerpen" },
            { title: "Negeri Para Penjelajah Fantasi", author: "J.K. Rowling", category: "1. Fiksi", sub: "Fantasi" },
            { title: "Petualangan Menjelajah Lembah Ilmu", author: "Hafiz Explorer", category: "1. Fiksi", sub: "Petualangan" },
            { title: "Misteri Kitab Kuning yang Hilang", author: "Detektif Madrasah", category: "1. Fiksi", sub: "Misteri" },
            { title: "Kisah Teladan Penuh Ketegangan", author: "Syekh Al-Ghazali", category: "1. Fiksi", sub: "Horor" },
            { title: "Romansa Cinta dalam Restu Ilahi", author: "Asma Nadia", category: "1. Fiksi", sub: "Drama" },

            // 2. Sastra
            { title: "Antologi Puisi Cahaya Pesantren", author: "Warga Madrasah", category: "2. Sastra", sub: "Puisi" },
            { title: "Prosa Nusantara & Kehidupan", author: "Pramoedya Ananta Toer", category: "2. Sastra", sub: "Prosa" },
            { title: "Kumpulan Antologi Sastra Klasik", author: "Pujangga Lama", category: "2. Sastra", sub: "Antologi" },

            // 3. Islami
            { title: "Sirah Nabawiyah: Sejarah Hidup Rasulullah", author: "Ibnu Hisyam", category: "3. Islami", sub: "Sirah" },
            { title: "Akhlakul Karimah di Era Digital", author: "Tim Literasi Madrasah", category: "3. Islami", sub: "Akhlak" },
            { title: "Fiqh Kontemporer & Solusi Umat", author: "Prof. Dr. Quraish Shihab", category: "3. Islami", sub: "Fikih" },
            { title: "Kitab Akidah Ahlus Sunnah Wal Jamaah", author: "Syaikh Utsaimin", category: "3. Islami", sub: "Akidah" },
            { title: "Tasawuf & Pembersihan Hati", author: "Imam Al-Ghazali", category: "3. Islami", sub: "Tasawuf" },
            { title: "Kisah Sahabat Nabi Pengukir Sejarah", author: "Khaled Muhammad Khalid", category: "3. Islami", sub: "Kisah Sahabat" },

            // 4. Sejarah
            { title: "Sejarah Nasional Indonesia Lengkap", author: "Sartono Kartodirdjo", category: "4. Sejarah", sub: "Sejarah Indonesia" },
            { title: "Sejarah Peradaban Islam Klasik", author: "Dr. Badri Yatim", category: "4. Sejarah", sub: "Sejarah Islam" },
            { title: "Sejarah Dunia untuk Pelajar", author: "H.G. Wells", category: "4. Sejarah", sub: "Sejarah Dunia" },

            // 5. Biografi & Memoar
            { title: "Biografi Buya Hamka: Ulama & Sastrawan", author: "Heri Jauhari", category: "5. Biografi & Memoar", sub: "Tokoh Islam" },
            { title: "Biografi Soekarno: Penyambung Lidah Rakyat", author: "Cindy Adams", category: "5. Biografi & Memoar", sub: "Tokoh Nasional" },
            { title: "Kisah Inspiratif Ilmuwan Muslim Dunia", author: "Prof. Al-Hassan", category: "5. Biografi & Memoar", sub: "Ilmuwan" },

            // 6. Pendidikan
            { title: "Metode Belajar Efektif Abad 21", author: "Tim Kurikulum Wakakur", category: "6. Pendidikan", sub: "Metode Belajar" },
            { title: "Pendidikan Karakter Berbasis Pesantren", author: "Dewan Guru Madrasah", category: "6. Pendidikan", sub: "Pendidikan Karakter" },

            // 7. Pengembangan Diri
            { title: "Atomic Habits untuk Pelajar Berprestasi", author: "James Clear", category: "7. Pengembangan Diri", sub: "Motivasi" },
            { title: "Kepemimpinan Efektif & Berintegritas", author: "John C. Maxwell", category: "7. Pengembangan Diri", sub: "Kepemimpinan" },
            { title: "Manajemen Waktu Santri Produktif", author: "K.H. Abdullah Gymnastiar", category: "7. Pengembangan Diri", sub: "Manajemen Waktu" },

            // 8. Psikologi
            { title: "Psikologi Remaja & Kesehatan Mental", author: "Dr. Elly Risman", category: "8. Psikologi", sub: "Psikologi Remaja" },
            { title: "Mengenal Tipe Kepribadian Manusia", author: "Carl Jung", category: "8. Psikologi", sub: "Kepribadian" },

            // 9. Sains & Matematika
            { title: "Biologi Modern untuk Tingkat Aliyah", author: "Campbell Reece", category: "9. Sains & Matematika", sub: "Biologi" },
            { title: "Fisika Kuantum & Alam Semesta", author: "Stephen Hawking", category: "9. Sains & Matematika", sub: "Fisika" },
            { title: "Matematika Asyik & Gampang", author: "Prof. Yohanes Surya", category: "9. Sains & Matematika", sub: "Matematika" },

            // 10. Teknologi & Digital
            { title: "Kecerdasan Buatan (AI) & Literasi Digital", author: "OpenAI Research", category: "10. Teknologi & Digital", sub: "AI" },
            { title: "Dasar Pemrograman Web & Komputer", author: "Tim IT Madrasah", category: "10. Teknologi & Digital", sub: "Pemrograman" },

            // 11. Sosial & Humaniora
            { title: "Sosiologi Masyarakat Modern", author: "Koentjaraningrat", category: "11. Sosial & Humaniora", sub: "Sosiologi" },
            { title: "Pengantar Filsafat Islam & Pemikiran", author: "Murtadha Muthahhari", category: "11. Sosial & Humaniora", sub: "Filsafat" },

            // 12. Ekonomi & Bisnis
            { title: "Ekonomi Syariah & Perbankan Islam", author: "Adiwarman Karim", category: "12. Ekonomi & Bisnis", sub: "Ekonomi" },
            { title: "Kewirausahaan Santri Mandiri", author: "Mentoring Bisnis MA", category: "12. Ekonomi & Bisnis", sub: "Kewirausahaan" },

            // 13. Seni & Kreativitas
            { title: "Seni Kaligrafi & Desain Grafis Islami", author: "Master Kaligrafi", category: "13. Seni & Kreativitas", sub: "Desain" },
            { title: "Panduan Menulis Kreatif untuk Pemula", author: "Asma Nadia", category: "13. Seni & Kreativitas", sub: "Menulis Kreatif" },

            // 14. Lingkungan & Alam
            { title: "Ekologi & Pelestarian Alam Sekitar", author: "Green Madrasah", category: "14. Lingkungan & Alam", sub: "Ekologi" },
            { title: "Pertanian Modern & Perubahan Iklim", author: "WWF Indonesia", category: "14. Lingkungan & Alam", sub: "Pertanian" },

            // 15. Referensi
            { title: "Kamus Besar Bahasa Indonesia (KBBI)", author: "Tim Balai Pustaka", category: "15. Referensi", sub: "Kamus" },
            { title: "Ensiklopedia Islam Indonesia", author: "Kemenag RI", category: "15. Referensi", sub: "Ensiklopedia" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            loadGenreCards();
        });

        function loadGenreCards() {
            const grid = document.getElementById('genre-cards-grid');
            if (!grid) return;
            let categories = [...new Set(masterBooks.map(b => b.category))].sort();

            let html = '';
            categories.forEach(cat => {
                let count = masterBooks.filter(b => b.category === cat).length;
                html += `
                    <div onclick="openSubgenre('${cat.replace(/'/g, "\\'")}')" class="glass-card border border-slate-200 p-5 rounded-2xl cursor-pointer hover:shadow-lg hover:border-emerald-500 transition text-center flex flex-col justify-between group">
                        <div>
                            <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-lg mx-auto mb-3 group-hover:bg-emerald-700 group-hover:text-white transition">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <h3 class="font-bold text-xs text-slate-900 group-hover:text-emerald-800 transition">${cat}</h3>
                        </div>
                        <span class="text-[10px] text-slate-400 font-semibold mt-3 bg-slate-50 py-1 px-2 rounded-full border">${count} Koleksi Buku</span>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function openSubgenre(categoryName) {
            document.getElementById('catalog-main-menu').classList.add('hidden');
            document.getElementById('catalog-sub-view').classList.remove('hidden');
            document.getElementById('current-genre-title').innerText = "Kategori: " + categoryName;

            let filtered = masterBooks.filter(b => b.category === categoryName);
            const subgrid = document.getElementById('subgenre-book-grid');
            let html = '';
            
            filtered.forEach(b => {
                let dummyPdf = 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf';
                let subBadge = b.sub ? `<span class="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-bold">${b.sub}</span>` : '';
                html += `
                    <div class="glass-card border border-slate-200/80 p-6 rounded-2xl flex flex-col justify-between shadow-xs">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-[11px] bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-bold border border-emerald-100">${b.category}</span>
                                ${subBadge}
                            </div>
                            <h3 class="font-extrabold text-slate-900 text-base">${b.title}</h3>
                            <p class="text-xs text-slate-500 mt-1 font-medium">${b.author}</p>
                        </div>
                        <div class="mt-6 flex gap-3">
                            <button onclick="openReader('${b.title.replace(/'/g, "\\'")}', '${dummyPdf}')" class="flex-1 text-center bg-emerald-700 hover:bg-emerald-800 text-white text-xs py-2.5 rounded-xl font-bold shadow-sm transition cursor-pointer"><i class="fa-solid fa-book-open-reader mr-1"></i> Baca</button>
                        </div>
                    </div>
                `;
            });
            subgrid.innerHTML = html;
        }

        function backToGenreMenu() {
            document.getElementById('catalog-sub-view').classList.add('hidden');
            document.getElementById('catalog-main-menu').classList.remove('hidden');
        }

        function globalSearchBooks() {
            const query = document.getElementById('search-book').value.toLowerCase();
            if(!query) {
                backToGenreMenu();
                return;
            }
            let filtered = masterBooks.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query));

            document.getElementById('catalog-main-menu').classList.add('hidden');
            document.getElementById('catalog-sub-view').classList.remove('hidden');
            document.getElementById('current-genre-title').innerText = "Hasil Pencarian: \"" + query + "\"";

            const subgrid = document.getElementById('subgenre-book-grid');
            if(filtered.length === 0) {
                subgrid.innerHTML = `<div class="p-6 bg-slate-50 border rounded-2xl text-center text-slate-500 text-xs col-span-full">Buku tidak ditemukan.</div>`;
                return;
            }
            let html = '';
            filtered.forEach(b => {
                let dummyPdf = 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf';
                html += `
                    <div class="glass-card border border-slate-200/80 p-6 rounded-2xl flex flex-col justify-between shadow-xs">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="text-[11px] bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-bold border border-emerald-100">${b.category}</span>
                            </div>
                            <h3 class="font-extrabold text-slate-900 text-base">${b.title}</h3>
                            <p class="text-xs text-slate-500 mt-1 font-medium">${b.author}</p>
                        </div>
                        <div class="mt-6 flex gap-3">
                            <button onclick="openReader('${b.title.replace(/'/g, "\\'")}', '${dummyPdf}')" class="flex-1 text-center bg-emerald-700 hover:bg-emerald-800 text-white text-xs py-2.5 rounded-xl font-bold shadow-sm transition cursor-pointer"><i class="fa-solid fa-book-open-reader mr-1"></i> Baca</button>
                        </div>
                    </div>
                `;
            });
            subgrid.innerHTML = html;
        }

        function openReader(title, url) {
            document.getElementById('reader-book-title').innerText = "Sedang Membaca: " + title;
            document.getElementById('reader-frame').src = url;
            document.getElementById('reader-modal').classList.remove('hidden');
        }

        function closeReader() {
            document.getElementById('reader-modal').classList.add('hidden');
            document.getElementById('reader-frame').src = '';
        }
    </script>
</body>
</html>
